# === Application Info ===
spring.application.name=tiptracker-backend

# === MySQL Configuration ===
# Local MySQL instance on the Lightsail server
spring.datasource.url=jdbc:mysql://localhost:3306/tiptracker
spring.datasource.username=tiptracker_user
# Password is provided via environment variable DB_PASSWORD (see systemd EnvironmentFile)
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# === JWT Settings ===
# Secret and expiration are provided via environment variables.
# These keys are NOT stored in the repo; Spring reads them from the environment.
#   APP_JWT_SECRET      - Base64-encoded secret key
#   APP_JWT_EXPIRATION  - Token lifetime in milliseconds (e.g., 86400000 for 24h)
APP_JWT_EXPIRATION=${APP_JWT_EXPIRATION:86400000}

# === SMTP Mail Configuration ===
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# === APNs (Push Notifications) ===
# Values provided via environment variables on the production server.
# APNS_KEY_PATH  — absolute path to the .p8 auth key file (never commit this file)
# APNS_KEY_ID    — 10-character key ID from Apple Developer portal
# APNS_TEAM_ID   — 10-character team ID from Apple Developer portal
# APNS_BUNDLE_ID — iOS app bundle identifier
# APNS_PRODUCTION — true for App Store, false for sandbox/TestFlight
apns.key-path=${APNS_KEY_PATH:}
apns.key-id=${APNS_KEY_ID:}
apns.team-id=${APNS_TEAM_ID:}
apns.bundle-id=${APNS_BUNDLE_ID:com.yourname.tipslip}
apns.production=${APNS_PRODUCTION:true}

# === Logging ===
logging.level.org.springframework.security=WARN